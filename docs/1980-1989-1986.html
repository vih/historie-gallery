                                  <h3>B000015</h3>
                                
                                  <p>Skolen købte tre joller i 1986 som følge af en forbedret økonomi. Disse tre joller blev navngivet Knud, Anna og Kaj. Navnet &quot;Kaj&quot; er med stor sandsynlighed en direkte opkaldelse efter netop Kaj Møller, som i disse år var fast ansat til at varetage praktisk arbejde på skolen.
          
          Det fremgår af årsskriftet fra 1986, at skolen i det meste af september måned 1986 havde alle 120 elever ude at sejle på fjorden i de nye joller. Eleverne var udelt begejstrede, og det blev besluttet, at jollerne fremover skulle indgå som en fast del af faget natur- og friluftsliv.
          
          Smakkejollerne bliver døbt af Kaj Møller (champagnen i højre hånd) Jørn Richter t.th. for Kaj. Knud Thomasen t.h. for mig. 
          
          Scannet som B000015.</p>
