          <div class="albumList"
              data-sub-html="<div class='lg-caption'>
                                  <h3>B000073</h3>
                                
                                  <p>Måske er det Malmø FF på trøjen, så en spiller fra Malmø på Den Jyske Idrætsskole. Bagpå fotografiet står der Foto: Ingvar Andersson, Dagens Nyheder.
          
          Træningslejr for den svenske fodboldklub Malmø FF (Malmö F.F.) har været på træningsophold på Den jyske Idrætsskole ad flere omgange i slutningen af 1960&#x27;erne. 
          
          Specifikt fremgår det af skolens kursuskalendere, at klubben var på træningslejr i disse to perioder:
          
          *   **Fra den 27. marts til den 2. april 1967**.
          *   **Fra den 24. marts til den 30. marts 1968**.
          
          Det var i øvrigt et meget udbredt fænomen, at svenske fodboldklubber valgte at lægge deres forårstræning på skolen i disse år. Skolens inspektør Knud Thomassen beskriver i en artikel fra 1967, at skolen hvert år fik besøg af mange svenske hold, fordi træningsforholdene i det tidlige forår var bedre i Danmark end hjemme i Sverige. Alene i det foregående år havde skolen haft besøg af hele 10 forskellige svenske klubber.</p>
