                                  <h3>20260503_162314: EM for ungdom i bordtennis, 1972</h3>
                                
                                  <p>Billede fra ungdoms EM i bordtennis i 1972. Man ser de sovjetrussiske deltagere som var i finalen. På billede ser man et glimt af Bjarne Hauger (står lidt i baggrunden) og Bente (i den stribede jakke) som ses tydeligt ved hans side.
          
          Tove Thomassen var fanebærer ved indmarch og ekspederede i kiosken (har avisudklip).
          
          ***
          
          Den Jyske Idrætsskole har i to omgange været vært for Europamesterskaberne i bordtennis for juniores.
          I 1967 blev det første Europamesterskab i bordtennis for juniores blev afholdt på skolen fra den 30. juli til den 5. august 1967 I 1972 var der 325 deltagere fra 24 nationer for piger, drenge og juniores fandt sted fra den 5. til den 13. august 1972 med direkte TV-Transmission i DR.
          
          Datering for billede er sandsynligvis 1972 baseret på Tove Thomassens kommentar.</p>

          <div class="albumList"
              data-sub-html="<div class='lg-caption'>
                                  <h3>B000073</h3>
                                
                                  <p>Måske er det Malmø FF på trøjen, så en spiller fra Malmø på Den Jyske Idrætsskole. Bagpå fotografiet står der Foto: Ingvar Andersson, Dagens Nyheder.
          
          Træningslejr for den svenske fodboldklub Malmø FF (Malmö F.F.) har været på træningsophold på Den jyske Idrætsskole ad flere omgange i slutningen af 1960&#x27;erne. 
          
          Specifikt fremgår det af skolens kursuskalendere, at klubben var på træningslejr i disse to perioder:
          
          *   **Fra den 27. marts til den 2. april 1967**.
