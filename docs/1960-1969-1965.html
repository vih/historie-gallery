                                  <h3>B000090: DBU’s instruktører ved Divisionstrænerkurset, formentlig 1965</h3>
                                
                                  <p>Fra venstre ses cheftræner for B 1901 Sten Pedersen, idræts- og landsholdslæge Frode Henriksen, cheftræner for Køge Boldklub Svend Otto Jørgensen og cheftræner for B 1913 Richard Madsen. Gruppen repræsenterede sandsynligvis Dansk Boldspil-Union og var centrale figurer i udviklingen af træneruddannelsen.
          
          Billedet er sandsynligvis fra Divisionstrænerkurset på Den Jyske Idrætsskole i 1965.
          
          Fotograf: Sandsynligvis Allan Simonsen.
          
          Identifikation: Personerne er identificeret ud fra navne, der står bag på billedet. At det skulle være fra divisionstrænerkursus er bl.a. baseret på Sten Pedersen ligner herren til højre på https://arkiv.dk/vis/2291622, og at der er lignende billeder i årsskriftet fra 1965.</p>
